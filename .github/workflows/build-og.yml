name: Build OG images

# Render a per-post Open Graph image (assets/og/<slug>.png) for every blog post
# whenever a post — or the generator or the font script — changes, then commit
# the rendered PNGs back to the repo.
#
# No infinite loop, by the same logic build-feed.yml uses: the output lives in
# assets/og/, which is OUTSIDE this workflow's blog/** trigger path, and the
# commit is marked [skip ci]. The bot's own commit can't re-trigger the run.
#
# This is now the single source of truth for OG images. The local publish
# pipeline no longer needs to generate or commit them; CI owns it, every time,
# deterministically.
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "scripts/generate_og.py"
      - "font.sh"
      - ".github/workflows/build-og.yml"
  workflow_dispatch: {}   # run by hand from the Actions tab (use this to backfill)

permissions:
  contents: write          # needed so the bot can commit the images back

concurrency:
  group: build-og
  cancel-in-progress: true

jobs:
  build-og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the rebase-before-push below is safe

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install Pillow

      - name: Fetch brand fonts
        run: bash font.sh

      - name: Render an OG image for every post
        run: |
          for post in blog/*/index.html; do
            python scripts/generate_og.py "$post"
          done

      - name: Commit any new or changed OG images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain assets/og)" ]; then
            echo "OG images unchanged — nothing to commit."
            exit 0
          fi
          git add assets/og
          git commit -m "chore: rebuild OG images [skip ci]"
          # build-feed.yml can push to main on the same event; rebase and retry
          # so whichever bot lands second doesn't fail on a moved ref.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "OG images updated."
              exit 0
            fi
            echo "push race — retrying ($attempt)…"
            sleep 3
          done
          echo "could not push after retries" >&2
          exit 1