name: Build RSS feed

# Regenerate feed.xml and blog/index.html whenever a post (or the generator
# itself) changes. The bot commits both back. blog/index.html sits under the
# blog/** trigger path, so the loop is broken by the [skip ci] tag in the commit
# message; a GITHUB_TOKEN push also won't start a new run. No infinite loop.
on:
  push:
    branches: [main]
    paths:
      - "blog/**"
      - "scripts/build_feed.py"
      - ".github/workflows/build-feed.yml"
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

permissions:
  contents: write          # needed so the bot can commit feed.xml + the index back

concurrency:
  group: build-feed
  cancel-in-progress: true

jobs:
  build-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install beautifulsoup4 lxml

      - name: Generate feed.xml and blog index
        run: python scripts/build_feed.py

      - name: Commit feed and index if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain feed.xml blog/index.html)" ]; then
            git add feed.xml blog/index.html
            git commit -m "chore: rebuild RSS feed and blog index [skip ci]"
            git push
            echo "feed.xml and blog/index.html updated."
          else
            echo "feed and index unchanged — nothing to commit."
          fi
